## Training Configuration for Reidac9 Dataset (Prompt_CAM with DINO)
## Usage: python main.py --config train_config_reidac9.yaml

# Dataset
data: reidac9
data_path: ./
class_num: 9

# Model
model: dino
pretrained_weights: vit_base_patch16_dino
train_type: prompt_cam
drop_path_rate: 0.1
normalized: true

# VPT (Visual Prompt Tuning)
vpt_num: 200
vpt_dropout: 0.1
vpt_layer: null
vpt_mode: null

# Optimizer
optimizer: sgd
lr: 0.005
wd: 0.001
momentum: 0.9

# Scheduler
epoch: 130
warmup_epoch: 20
lr_min: 1.0e-06
warmup_lr_init: 0

# Batch
batch_size: 16
test_batch_size: 32
crop_size: 224

# Evaluation
eval_freq: 10
early_patience: 101
final_acc_hp: true
store_ckp: true

# Run settings
final_run: true
full: false
debug: true
gpu_num: 1
random_seed: 42
